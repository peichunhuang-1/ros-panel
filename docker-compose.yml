services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount source for live edits without rebuilding
      - ./bin:/app/bin
      - ./server:/app/server
      - schema-cache:/app/.ros-panel-schemas
    environment:
      PORT: "3000"
      SCHEMA_DIR: /app/.ros-panel-schemas
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3001"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./server:/app/server
      - ./test:/app/test
      - ./test-output:/app/test-output
    environment:
      SCHEMA_GEN_OUTPUT: /app/test-output
    command: >
      /bin/bash -c "source /opt/ros/humble/setup.bash && npm test"
    profiles:
      - test

  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-test
    volumes:
      - ./src:/app/src
      - ./vite.config.ts:/app/vite.config.ts
    profiles:
      - frontend-test

  build-lib:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-test
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./tsconfig.json:/app/tsconfig.json
      - ./vite.config.ts:/app/vite.config.ts
    command: ["npm", "run", "build"]
    profiles:
      - build-lib

  demo:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-test
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    ports:
      - "5173:5173"
    environment:
      VITE_ROS_SERVER_URL: "http://localhost:3000"
    command: ["npm", "run", "demo"]
    profiles:
      - demo

  integration-test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./server:/app/server
      - ./test:/app/test
    command: ["bash", "/app/test/integration.sh"]
    profiles:
      - integration-test

volumes:
  schema-cache:
