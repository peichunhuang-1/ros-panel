services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount source for live edits without rebuilding
      - ./bin:/app/bin
      - ./server:/app/server
      - schema-cache:/app/.ros-panel-schemas
    environment:
      PORT: "3000"
      SCHEMA_DIR: /app/.ros-panel-schemas
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3001"
      # Enable ROS2 DDS multicast over the host network on macOS/Linux
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    environment:
      VITE_SERVER_URL: "http://localhost:3000"
    # 'vite build --watch' (the dev script) is library watch mode, not a dev server
    command: sh -c "npm install && npm run dev"
    depends_on:
      - server

volumes:
  schema-cache:
  node-modules:
