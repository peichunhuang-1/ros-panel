services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount source for live edits without rebuilding
      - ./bin:/app/bin
      - ./server:/app/server
      - schema-cache:/app/.ros-panel-schemas
    environment:
      PORT: "3000"
      SCHEMA_DIR: /app/.ros-panel-schemas
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3001"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./server:/app/server
      - ./test:/app/test
      - ./test-output:/app/test-output
    environment:
      SCHEMA_GEN_OUTPUT: /app/test-output
    command: >
      /bin/bash -c "source /opt/ros/humble/setup.bash && npm test"
    profiles:
      - test

volumes:
  schema-cache:
