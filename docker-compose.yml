services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount source for live edits without rebuilding
      - ./bin:/app/bin
      - ./server:/app/server
      - schema-cache:/app/.ros-panel-schemas
    environment:
      PORT: "3000"
      SCHEMA_DIR: /app/.ros-panel-schemas
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3001"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  schema-cache:
